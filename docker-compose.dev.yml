version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - DATA_DIR=/data
      - MIGRATIONS_PATH=/root/migrations
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=http://localhost:8080/api/auth/github/callback
      - GITHUB_ALLOWED_USER=${GITHUB_ALLOWED_USER:-steenfuentes}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/data:/data
      - ./backend/migrations:/root/migrations
    networks:
      - portfolio-network

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - portfolio-network
    depends_on:
      - backend

networks:
  portfolio-network:
    driver: bridge
