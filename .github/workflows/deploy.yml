name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_REGION: us-west1
  BACKEND_SERVICE_NAME: steenfuentes-backend
  FRONTEND_SERVICE_NAME: steenfuentes-frontend

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Build and push backend Docker image
      run: |
        docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }} ./backend
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy backend to Cloud Run
      id: deploy-backend
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.BACKEND_SERVICE_NAME }}
        image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}
        region: ${{ env.GCP_REGION }}
        env_vars: |
          ENVIRONMENT=production
          PORT=8080
          DATA_DIR=/data
          MIGRATIONS_PATH=/app/migrations
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKUP_BUCKET=${{ secrets.BACKUP_BUCKET }}
          BACKUP_INTERVAL=6h
        flags: |
          --allow-unauthenticated
          --min-instances=1
          --max-instances=10
          --memory=512Mi
          --cpu=1
          --health-check-url=/health

    - name: Output backend URL
      run: |
        echo "Backend URL: ${{ steps.deploy-backend.outputs.url }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Get backend URL
      id: backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)')
        echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

    - name: Build and push frontend Docker image
      run: |
        cd frontend
        docker build \
          --build-arg VITE_API_URL=${{ steps.backend-url.outputs.url }}/api \
          -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }} \
          .
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy frontend to Cloud Run
      id: deploy-frontend
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.FRONTEND_SERVICE_NAME }}
        image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/steenfuentes/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}
        region: ${{ env.GCP_REGION }}
        env_vars: |
          VITE_API_URL=${{ steps.backend-url.outputs.url }}/api
          PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}/api
        flags: |
          --allow-unauthenticated
          --min-instances=1
          --max-instances=10
          --memory=256Mi
          --cpu=1
          --health-check-url=/health
