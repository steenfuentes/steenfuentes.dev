name: Cleanup Preview Deployment

on:
  pull_request:
    types: [closed]

env:
  GCP_REGION: us-central1

jobs:
  cleanup:
    name: Delete Preview Services
    runs-on: ubuntu-latest
    
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Delete preview services
      run: |
        # Delete frontend service
        PREVIEW_FRONTEND="preview-frontend-pr-${{ github.event.pull_request.number }}"
        gcloud run services delete ${PREVIEW_FRONTEND} \
          --region=${{ env.GCP_REGION }} \
          --quiet || echo "Frontend service not found"
        
        # Delete backend service
        PREVIEW_BACKEND="preview-backend-pr-${{ github.event.pull_request.number }}"
        gcloud run services delete ${PREVIEW_BACKEND} \
          --region=${{ env.GCP_REGION }} \
          --quiet || echo "Backend service not found"
        
        echo "✅ Preview services cleaned up for PR #${{ github.event.pull_request.number }}"